<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get a Free Quote | Kenest Cleaning Co. — St. Louis, MO</title>
  <meta name="description" content="Request a free cleaning quote from Kenest Cleaning Co. in St. Louis. No contracts, no pressure.">
  <link rel="icon" href="/logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="nav-placeholder"></div>

<section class="page-hero">
  <div class="container">
    <span class="section-label">Free Quote</span>
    <h1 class="page-hero-title">Get Your Free Quote</h1>
    <p class="page-hero-sub">Fill out the form below and we will get back to you within 24 hours to discuss your space and schedule a free walkthrough.</p>
  </div>
</section>

<section class="section bg-gray">
  <div class="container">
    <div class="quote-form-wrapper fade-up">
      <form id="quoteForm">
        <div class="form-grid">
          <div class="field required">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Your full name" required>
          </div>
          <div class="field">
            <label for="company">Company (Optional)</label>
            <input type="text" id="company" name="company" placeholder="Your company or business">
          </div>
        </div>
        <div class="form-grid form-section-gap">
          <div class="field required">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" placeholder="(314) 000-0000" required>
          </div>
          <div class="field required">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>
          </div>
        </div>
        <div class="form-grid full form-section-gap">
          <div class="field required">
            <label for="service">Service Type</label>
            <select id="service" name="service" required>
              <option value="">Select a service...</option>
              <option value="Commercial">Commercial Cleaning</option>
              <option value="Post-Construction">Post-Construction Cleaning</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>
        <div class="form-grid form-section-gap">
          <div class="field">
            <label for="propertyType">Property Type</label>
            <input type="text" id="propertyType" name="propertyType" placeholder="e.g. Office, Single-Family Home, New Build">
          </div>
          <div class="field">
            <label for="sqft">Approximate Square Footage</label>
            <input type="text" id="sqft" name="sqft" placeholder="e.g. 2,500 sq ft">
          </div>
        </div>
        <div class="form-grid full form-section-gap">
          <div class="field">
            <label for="address">Address or ZIP Code</label>
            <input type="text" id="address" name="address" placeholder="St. Louis, MO 63101">
          </div>
        </div>
        <div class="form-grid form-section-gap">
          <div class="field">
            <label for="frequency">Preferred Frequency</label>
            <select id="frequency" name="frequency">
              <option value="">Select frequency...</option>
              <option value="One-time">One-time</option>
              <option value="Weekly">Weekly</option>
              <option value="Bi-weekly">Bi-weekly</option>
              <option value="Monthly">Monthly</option>
              <option value="Daily">Daily</option>
              <option value="Not Sure">Not Sure</option>
            </select>
          </div>
          <div class="field">
            <label for="startDate">Preferred Start Date</label>
            <input type="date" id="startDate" name="startDate">
          </div>
        </div>
        <div class="form-grid full form-section-gap">
          <div class="field">
            <label for="message">Additional Notes</label>
            <textarea id="message" name="message" rows="4" placeholder="Tell us anything else about your space or what you need..."></textarea>
          </div>
        </div>
        <div class="form-submit form-section-gap">
          <button type="submit" class="btn-primary"><i class="fa-solid fa-paper-plane"></i> Send Quote Request</button>
        </div>
      </form>

      <div class="success-card" id="quoteSuccess">
        <div class="success-icon"><i class="fa-solid fa-circle-check"></i></div>
        <h3>Quote Request Sent!</h3>
        <p>Thanks! We will contact you within 24 hours to schedule your free walkthrough.</p>
      </div>
    </div>
  </div>
</section>

<div id="footer-placeholder"></div>
<script src="/js/main.js"></script>
</body>
</html>
